name: Auto Create Pull Request

on:
  push:
    branches-ignore:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR if none exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          count=$(gh pr list --head "$branch" --base develop --state open --json number --jq 'length')
          if [ "$count" -eq 0 ]; then
            gh pr create --base develop --head "$branch" --fill
          else
            echo "PR already exists for $branch, skipping."
          fi
