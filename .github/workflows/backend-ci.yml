name: Backend CI

on:
  push:
    branches-ignore:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: spotlessCheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: spotlessCheck
        run: ./gradlew spotlessCheck
      - name: test
        run: ./gradlew test
