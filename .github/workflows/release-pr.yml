name: Release PR

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release PR (develop -> main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr list --base main --head develop --state open --json number --jq '.[0].number' | grep -q .; then
            echo "Release PR already open"
          else
            gh pr create --base main --head develop \
              --title "Release: develop -> main" \
              --body "Automated release PR created by release-pr.yml"
          fi
