services:
  postgres:
    image: postgres:16-alpine
    container_name: ielts-creator-postgres
    environment:
      POSTGRES_DB: ielts_creator
      POSTGRES_USER: ielts_creator
      POSTGRES_PASSWORD: ielts_creator_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ielts_creator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
