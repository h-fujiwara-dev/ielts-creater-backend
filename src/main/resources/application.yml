spring:
  application:
    name: ielts-creater-api
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

# Phase1(no-auth)からPhase2(Cognito)への切り替えはこのプロパティで行う（実装規約.md 7章）
app:
  auth:
    mode: cognito
    cognito:
      # infra（Terraform envs/dev の outputs）から払い出される値を環境変数で注入する
      issuer-uri: ${COGNITO_ISSUER_URI}
      client-id: ${COGNITO_APP_CLIENT_ID}
      region: ${COGNITO_REGION:ap-northeast-1}
  cors:
    allowed-origins: ""
  # ゲスト機能（#00056）。共有デモアカウントの資格情報はinfra側のSecrets Manager経由でECSに注入される
  guest:
    enabled: true
    daily-ip-limit: 3
    retention-hours: 24
    cognito:
      client-id: ${GUEST_COGNITO_CLIENT_ID:}
      username: ${GUEST_COGNITO_USERNAME:}
      password: ${GUEST_COGNITO_PASSWORD:}
  # stub/実装の切り替え（実装規約.md 3.4章、#00033）。既定はstub（APIコスト・外部依存なし）。
  # 実際にOpenAI/Pollyへ接続する場合のみ環境変数APP_GENERATION_MODE=openaiで上書きする
  generation:
    mode: stub
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini
    connect-timeout: 5s
    read-timeout: 60s
    max-attempts: 2
    retry-backoff: 2s
  polly:
    api-call-attempt-timeout: 10s
    api-call-timeout: 25s
    max-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
